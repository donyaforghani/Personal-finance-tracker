{% extends "base.html" %}
{% block title %}Add Transaction{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2>Add New Transaction</h2>
        <form method="POST" class="form">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" id="date" name="date" class="form-control" placeholder="dd-mm-yyyy (leave empty for today)">
                <small>Leave empty for today's date</small>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <div class="category-selector">
                    <input type="radio" id="income" name="category" value="INCOME" required>
                    <label for="income" class="category-btn income-btn">
                        <span>📈</span> Income
                    </label>
                    <input type="radio" id="expense" name="category" value="EXPENSE" required>
                    <label for="expense" class="category-btn expense-btn">
                        <span>📉</span> Expense
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" class="form-control" placeholder="e.g., Monthly salary, Groceries...">
            </div>

            <button type="submit" class="btn btn-primary btn-large">💾 Save Transaction</button>
        </form>
    </div>
</div>
{% endblock %}
